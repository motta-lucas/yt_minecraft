[project]
name = "yt_minecraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    #--------------------------------------------------------------------
    # DATA MANIPULTION - Processamento de dados
    #--------------------------------------------------------------------
    "polars>=0.20.0", 
    "pyarrow>=14.0.0",

    #--------------------------------------------------------
    # AIRFLOW PROVIDERS - Extensões necessárias para Airflow
    #--------------------------------------------------------
    "apache-airflow-providers-postgres",
    "apache-airflow-providers-celery",

    #--------------------------------------------------------
    # HTTP & API requests - Para comunicação com Spotify API
    #--------------------------------------------------------
    "requests>=2.31.0,<3.0.0",

    #--------------------------------------------------------------------
    # ENVIRONMENT & CONFIGURATION - To manage environment variables
    #--------------------------------------------------------------------
    "python-dotenv>=1.0.0,<2.0.0",

    #--------------------------------------------------------------------
    #DATE & TIME HANDLING - Dates and timezones manipulation
    #--------------------------------------------------------------------
    "python-dateutil>=2.8.2,<3.0.0",
    "pytz==2023.3",
    "pendulum>=2.1.2,<3.0.0",


    #--------------------------------------------------------------------
    #DATABASE DRIVERS - Drivers para conexão com PostgreSQL
    #--------------------------------------------------------------------
    "psycopg2-binary>=2.9.0,<3.0.0",
    "dbt-core==1.7.0",
    "dbt-postgres==1.7.0",

    #--------------------------------------------------------------------
    # TYPING & UTILITIES - Typing extensions (Already included in Python 3.8+)
    #--------------------------------------------------------------------
    # typing-extensions - Usually built in Airflow, but explicit declaration works better


]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]

[dependency-groups]
dev = [
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
    "ipykernel>=7.2.0",
]
